# Compila SOMENTE o APK Android com o jogo (chars, stages etc.) ja embutido.
# Coloque este arquivo em .github/workflows/android.yml no seu fork do Ikemen-GO.
#
# Os dados do jogo vem de um zip anexado a uma Release do GitHub (tag "data").
# O zip deve ter chars/, stages/, sound/... NA RAIZ (sem pasta extra por fora).
name: android-apk

on:
  workflow_dispatch:
    inputs:
      wrapper_repo:
        description: 'URL do seu fork do ikemen-droid (publico)'
        required: true
        default: 'https://github.com/SEU_USUARIO/ikemen-droid.git'
      wrapper_ref:
        description: 'Branch do wrapper'
        required: true
        default: 'main'
      data_repo:
        description: 'Repositorio (dono/nome) que tem a Release com os dados'
        required: true
        default: 'SEU_USUARIO/SEU_REPO'
      data_tag:
        description: 'Tag da Release com os dados'
        required: true
        default: 'data'
      data_asset:
        description: 'Nome do zip anexado na Release'
        required: true
        default: 'data.zip'
      beta_number:
        description: 'Numero do beta (ex.: 88). Vazio = usa o numero da execucao do workflow (github.run_number)'
        type: string
        required: false
        default: ''
      final_build:
        description: 'Build FINAL: sem mensagem de log no inicio e sem botao de selecionar pasta (gera so o APK final). Desmarcado = preview/beta para continuar trabalhando'
        type: boolean
        required: true
        default: false
      remove_default_content:
        description: 'Remover chars e stages padrao do jogo (kfm, stage0 etc.) do APK'
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Definir versao (Beta N)
        run: |
          N="${{ inputs.beta_number }}"
          if [ -z "$N" ]; then N="${{ github.run_number }}"; fi
          if ! [[ "$N" =~ ^[0-9]+$ ]]; then echo "::error::beta_number invalido: '$N'"; exit 1; fi
          echo "BETA_NUMBER=$N" >> "$GITHUB_ENV"
          echo "Versao: Beta $N"

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Baixar dados do jogo (Release)
        env:
          # Se data_repo for outro repo PRIVADO, crie o secret DATA_TOKEN (PAT com leitura).
          GH_TOKEN: ${{ secrets.DATA_TOKEN != '' && secrets.DATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ inputs.data_repo }}"
          TAG="${{ inputs.data_tag }}"
          if [[ "$REPO" == *SEU_USUARIO* ]]; then
            echo "::error::data_repo ainda esta com o valor padrao ($REPO). Informe dono/nome do repo que tem a Release, ex.: Thelabturneigh/Ikemen-GO"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release com tag '$TAG' nao encontrada em '$REPO' (ou o token nao tem acesso). Releases visiveis:"
            gh release list --repo "$REPO" --limit 20 || true
            echo "Dicas: a Release precisa estar PUBLICADA (nao rascunho); a tag e case-sensitive; se o repo for privado/outro dono, crie o secret DATA_TOKEN."
            exit 1
          fi
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "${{ inputs.data_asset }}" \
            --dir /tmp --clobber
          # Extrai na raiz do Ikemen-GO (o build.sh resolve os caminhos a partir daqui)
          unzip -q -o "/tmp/${{ inputs.data_asset }}" -d .
          # Lista dos arquivos do zip, usada para gerar o manifest
          unzip -Z1 "/tmp/${{ inputs.data_asset }}" | grep -v '/$' > /tmp/data_files.txt
          echo "Arquivos no zip: $(wc -l < /tmp/data_files.txt)"
          if grep -q ' ' /tmp/data_files.txt; then
            echo "::warning::Ha arquivos com espaco no nome; o build.sh divide o manifest por espaco e eles serao ignorados. Renomeie-os."
          fi

      - name: Preparar wrapper com manifest atualizado
        run: |
          git clone --depth=1 -b "${{ inputs.wrapper_ref }}" "${{ inputs.wrapper_repo }}" wrapper_src
          # Nome do app no celular
          sed -i 's|\(<string name="app_name"[^>]*>\)[^<]*\(</string>\)|\1Anime LabStar\2|' \
            wrapper_src/app/src/main/res/values/strings.xml
          grep 'name="app_name"' wrapper_src/app/src/main/res/values/strings.xml
          # Nome do app no build beta (o beta tem o proprio app_name)
          if [ -f wrapper_src/app/src/beta/res/values/strings.xml ]; then
            sed -i 's|\(<string name="app_name"[^>]*>\)[^<]*\(</string>\)|\1Anime LabStar Beta\2|' \
              wrapper_src/app/src/beta/res/values/strings.xml
          fi
          # Versao do APK (o Android usa versionCode para saber qual e mais novo)
          GRADLE=wrapper_src/app/build.gradle
          sed -i "s|versionCode [0-9]*|versionCode $BETA_NUMBER|; s|versionName \"[^\"]*\"|versionName \"Beta $BETA_NUMBER\"|" "$GRADLE"
          grep -E 'versionCode|versionName|targetSdkVersion|applicationId' "$GRADLE"
          # Mensagem de log no inicio: ligada nos builds de trabalho, desligada no FINAL
          BOOLS=wrapper_src/app/src/main/res/values/bools.xml
          if ! grep -q 'name="show_log_viewer"' "$BOOLS"; then
            echo "::error::Seu ikemen-droid ainda nao tem show_log_viewer em bools.xml. Envie os arquivos alterados (SDLActivity.java e bools.xml) para o fork do ikemen-droid."
            exit 1
          fi
          if [ "${{ inputs.final_build }}" = "true" ]; then SHOWLOG=false; else SHOWLOG=true; fi
          sed -i "s|\(<bool name=\"show_log_viewer\">\)[^<]*\(</bool>\)|\1$SHOWLOG\2|" "$BOOLS"
          grep 'show_log_viewer' "$BOOLS"
          M=wrapper_src/app/src/main/assets/manifest.txt
          if [ "${{ inputs.remove_default_content }}" = "true" ]; then
            # Tira do manifest original todos os arquivos dentro de chars/ e stages/
            # (kfm, kfm720, stage0, stage1, stage3d etc.). As linhas "chars/" e "stages/"
            # (as pastas em si) ficam. O que vier do seu zip e adicionado logo abaixo.
            grep -v -E '^(chars|stages)/.+' "$M" > /tmp/manifest.nodefault || true
            cp /tmp/manifest.nodefault "$M"
            echo "Chars e stages padrao removidos do manifest."
          fi
          # O AssetExtractor do app so extrai arquivos LISTADOS no manifest,
          # entao cada arquivo do zip precisa estar nele.
          cat /tmp/data_files.txt >> "$M"
          # Remove duplicados e linhas vazias
          tr -s '\r' '\n' < "$M" | grep -v '^[[:space:]]*$' | sort -u > /tmp/manifest.sorted
          cp /tmp/manifest.sorted "$M"
          echo "Linhas no manifest final: $(wc -l < "$M")"

      - name: Compilar APK (Docker)
        env:
          # Aparece no canto inferior da tela inicial do jogo
          APP_VERSION: Beta ${{ env.BETA_NUMBER }}
        run: |
          chmod +x build/build.sh
          docker compose -f build/docker/android/docker-compose.yml build android-build
          # /work dentro do container e a raiz do repo, entao wrapper_src fica em /work/wrapper_src
          # FINAL: nao compila o beta (que tem o botao de selecionar pasta)
          if [ "${{ inputs.final_build }}" = "true" ]; then BETA=0; else BETA=1; fi
          docker compose -f build/docker/android/docker-compose.yml run --rm \
            -e ANDROID_APK_REPO="/work/wrapper_src" \
            -e BUILD_ANDROID_BETA="$BETA" \
            android-build

      - name: Renomear APK
        run: |
          # O Docker cria os arquivos de bin/ como root; devolve ao usuario do runner
          sudo chown -R "$(id -u):$(id -g)" bin
          if [ "${{ inputs.final_build }}" = "true" ]; then
            mv bin/ikemen-go.apk bin/AnimeLabStar.apk
          else
            mv bin/ikemen-go.apk bin/AnimeLabStar-preview.apk
            [ -f bin/ikemen-go-beta.apk ] && mv bin/ikemen-go-beta.apk bin/AnimeLabStar-beta.apk || true
          fi

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-labstar-${{ inputs.final_build && 'final' || 'preview' }}
          path: |
            bin/AnimeLabStar.apk
            bin/AnimeLabStar-preview.apk
            bin/AnimeLabStar-beta.apk
          if-no-files-found: error
